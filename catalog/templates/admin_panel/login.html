<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Kirish</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f6fa;">
  <div class="form-card" style="width:100%;max-width:400px;text-align:center;">
    <h2 style="margin-bottom:24px;">Admin Panel</h2>
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group" style="text-align:left;">
        <label for="username">Foydalanuvchi nomi</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group" style="text-align:left;">
        <label for="password">Parol</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Kirish</button>
    </form>
  </div>
</body>
</html>
