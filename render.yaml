services:
  - type: web
    name: ds-katalog
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn catalogue_web.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
